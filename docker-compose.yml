version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  python-event-generator:
    build:
      context: ./python-event-generator
      dockerfile: Dockerfile
    container_name: python-event-generator
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC=listen_events
      - NUM_USERS=5000
    command: >
      python -u event_generator.py
      --nusers 5000
      --kafka-broker-list kafka:29092
      --kafka-topic listen_events
      --start-time 2025-01-01T00:00:00
      --continuous

  spark-streaming:
    build:
      context: ./spark-streaming
      dockerfile: docker/Dockerfile
    container_name: spark-streaming
    depends_on:
      - kafka
    environment:
      # GCP Configuration
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - BIGQUERY_DATASET=${BIGQUERY_DATASET:-music_streaming_data}
      - BIGQUERY_TABLE=${BIGQUERY_TABLE:-raw_events}
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/spark-app/credentials/gcp-service-account-key.json
      
      # Kafka Configuration
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-music-streaming-events}
      - KAFKA_READY_TIMEOUT=60
      
      # Spark Configuration
      - SPARK_MASTER=${SPARK_MASTER:-local[*]}
      - SPARK_APP_NAME=MusicStreamingPipeline
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-2g}
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-2g}
      - SPARK_LOG_LEVEL=${SPARK_LOG_LEVEL:-WARN}
      
      # Application Configuration
      - CONFIG_PATH=/opt/spark-app/config/config.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DRY_RUN=${DRY_RUN:-false}
    
    volumes:
      # Mount GCP credentials (REQUIRED - update path on host)
      - ./spark-streaming/credentials:/opt/spark-app/credentials:ro
      
      # Mount checkpoints directory for stream processing state
      - spark-checkpoints:/opt/spark-app/checkpoints
      
      # Mount logs directory for debugging
      - spark-logs:/opt/spark-app/logs
      
      # Optional: Mount config for live updates during development
      # - ./spark-streaming/config:/opt/spark-app/config:ro
      
      # Optional: Mount source code for development (hot reload)
      # - ./spark-streaming/src:/opt/spark-app/src:ro
    
    ports:
      # Spark UI
      - "4040:4040"
      # Spark History Server (if enabled)
      - "18080:18080"
    
    networks:
      - default
    
    restart: unless-stopped
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
  
  # dbt Analytics Service (optional - run manually as needed)
  # Usage: docker-compose run --rm dbt run
  #        docker-compose run --rm dbt test
  dbt:
    build:
      context: ./dbt
      dockerfile: docker/Dockerfile
    container_name: dbt-music-streaming
    profiles: ["analytics"]  # Optional profile - only start when explicitly requested
    volumes:
      # Mount dbt project for development
      - ./dbt/models:/usr/app/models
      - ./dbt/macros:/usr/app/macros
      - ./dbt/tests:/usr/app/tests
      
      # Mount GCP credentials (same as Spark)
      - ./spark-streaming/credentials:/credentials:ro
      
      # Mount output directories
      - ./dbt/target:/usr/app/target
      - ./dbt/logs:/usr/app/logs
    
    environment:
      - DBT_PROFILES_DIR=/usr/app
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/gcp-service-account-key.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}

  # ===== Apache Airflow - Orchestration Layer (Phase 6) =====
  
  # PostgreSQL database for Airflow metadata
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD:-airflow}
      - POSTGRES_DB=airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Airflow Webserver
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: docker/Dockerfile
    container_name: airflow-webserver
    depends_on:
      - airflow-postgres
      - airflow-init
    environment:
      # Core Airflow settings
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      
      # Webserver settings
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-airflowsecretkey}
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      
      # Email settings (SMTP)
      - AIRFLOW__EMAIL__EMAIL_BACKEND=airflow.utils.email.send_email_smtp
      - AIRFLOW__SMTP__SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - AIRFLOW__SMTP__SMTP_STARTTLS=True
      - AIRFLOW__SMTP__SMTP_SSL=False
      - AIRFLOW__SMTP__SMTP_PORT=${SMTP_PORT:-587}
      - AIRFLOW__SMTP__SMTP_MAIL_FROM=${SMTP_MAIL_FROM:-airflow@example.com}
      - AIRFLOW__SMTP__SMTP_USER=${SMTP_USER}
      - AIRFLOW__SMTP__SMTP_PASSWORD=${SMTP_PASSWORD}
      
      # Alert email
      - AIRFLOW_ALERT_EMAIL=${AIRFLOW_ALERT_EMAIL:-admin@example.com}
      
      # GCP credentials for BigQuery monitoring
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/gcp-service-account-key.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    
    volumes:
      # Mount DAGs directory
      - ./airflow/dags:/opt/airflow/dags
      
      # Mount plugins directory
      - ./airflow/plugins:/opt/airflow/plugins
      
      # Mount logs directory
      - ./airflow/logs:/opt/airflow/logs
      
      # Mount dbt project (for DAGs to access)
      - ./dbt:/opt/airflow/dbt
      
      # Mount GCP credentials
      - ./spark-streaming/credentials:/credentials:ro
      
      # Mount docker socket to allow DAGs to run docker compose commands
      - /var/run/docker.sock:/var/run/docker.sock
    
    ports:
      - "8080:8080"
    
    command: webserver
    
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    restart: unless-stopped

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: docker/Dockerfile
    container_name: airflow-scheduler
    depends_on:
      - airflow-postgres
      - airflow-init
    environment:
      # Core Airflow settings
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      
      # Scheduler settings
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=30
      
      # Email settings (SMTP)
      - AIRFLOW__EMAIL__EMAIL_BACKEND=airflow.utils.email.send_email_smtp
      - AIRFLOW__SMTP__SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - AIRFLOW__SMTP__SMTP_STARTTLS=True
      - AIRFLOW__SMTP__SMTP_SSL=False
      - AIRFLOW__SMTP__SMTP_PORT=${SMTP_PORT:-587}
      - AIRFLOW__SMTP__SMTP_MAIL_FROM=${SMTP_MAIL_FROM:-airflow@example.com}
      - AIRFLOW__SMTP__SMTP_USER=${SMTP_USER}
      - AIRFLOW__SMTP__SMTP_PASSWORD=${SMTP_PASSWORD}
      
      # Alert email
      - AIRFLOW_ALERT_EMAIL=${AIRFLOW_ALERT_EMAIL:-admin@example.com}
      
      # GCP credentials for BigQuery monitoring
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/gcp-service-account-key.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      
      # Project root path on HOST machine (for dbt docker-compose volume mounts)
      - PROJECT_ROOT=${PROJECT_ROOT}
      - CREDENTIALS_PATH=${CREDENTIALS_PATH}
    
    volumes:
      # Mount DAGs directory
      - ./airflow/dags:/opt/airflow/dags
      
      # Mount plugins directory
      - ./airflow/plugins:/opt/airflow/plugins
      
      # Mount logs directory
      - ./airflow/logs:/opt/airflow/logs
      
      # Mount dbt project (for DAGs to access)
      - ./dbt:/opt/airflow/dbt
      
      # Mount GCP credentials
      - ./spark-streaming/credentials:/credentials:ro
      
      # Mount docker socket to allow DAGs to run docker compose commands
      - /var/run/docker.sock:/var/run/docker.sock
    
    command: scheduler
    
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    restart: unless-stopped

  # Airflow Initialization (one-time setup)
  airflow-init:
    build:
      context: ./airflow
      dockerfile: docker/Dockerfile
    container_name: airflow-init
    depends_on:
      - airflow-postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Initializing Airflow database..."
        airflow db init
        echo "Creating admin user..."
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email ${AIRFLOW_ALERT_EMAIL:-admin@example.com} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
        echo "Airflow initialization complete!"
    
    restart: on-failure

volumes:
  kafka-data:
  spark-checkpoints:
  spark-logs:
  airflow-postgres-data:
