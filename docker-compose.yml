version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  eventsim:
    image: eventsim:1.0
    container_name: eventsim
    depends_on:
      - kafka
    command: >
      -c examples/example-config.json
      --start-time "2024-01-01T00:00:00"
      --end-time "2024-12-31T23:59:59"
      --nusers 1000
      --kafkaBrokerList kafka:29092
      --continuous

  spark-streaming:
    build:
      context: ./spark-streaming
      dockerfile: docker/Dockerfile
    container_name: spark-streaming
    depends_on:
      - kafka
    environment:
      # GCP Configuration
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - BIGQUERY_DATASET=${BIGQUERY_DATASET:-music_streaming_data}
      - BIGQUERY_TABLE=${BIGQUERY_TABLE:-raw_events}
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/spark-app/credentials/gcp-service-account-key.json
      
      # Kafka Configuration
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-music-streaming-events}
      - KAFKA_READY_TIMEOUT=60
      
      # Spark Configuration
      - SPARK_MASTER=${SPARK_MASTER:-local[*]}
      - SPARK_APP_NAME=MusicStreamingPipeline
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-2g}
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-2g}
      - SPARK_LOG_LEVEL=${SPARK_LOG_LEVEL:-WARN}
      
      # Application Configuration
      - CONFIG_PATH=/opt/spark-app/config/config.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DRY_RUN=${DRY_RUN:-false}
    
    volumes:
      # Mount GCP credentials (REQUIRED - update path on host)
      - ./spark-streaming/credentials:/opt/spark-app/credentials:ro
      
      # Mount checkpoints directory for stream processing state
      - spark-checkpoints:/opt/spark-app/checkpoints
      
      # Mount logs directory for debugging
      - spark-logs:/opt/spark-app/logs
      
      # Optional: Mount config for live updates during development
      # - ./spark-streaming/config:/opt/spark-app/config:ro
      
      # Optional: Mount source code for development (hot reload)
      # - ./spark-streaming/src:/opt/spark-app/src:ro
    
    ports:
      # Spark UI
      - "4040:4040"
      # Spark History Server (if enabled)
      - "18080:18080"
    
    networks:
      - default
    
    restart: unless-stopped
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
  
  # dbt Analytics Service (optional - run manually as needed)
  # Usage: docker-compose run --rm dbt run
  #        docker-compose run --rm dbt test
  dbt:
    build:
      context: ./dbt
      dockerfile: docker/Dockerfile
    container_name: dbt-music-streaming
    profiles: ["analytics"]  # Optional profile - only start when explicitly requested
    volumes:
      # Mount dbt project for development
      - ./dbt/models:/usr/app/models
      - ./dbt/macros:/usr/app/macros
      - ./dbt/tests:/usr/app/tests
      
      # Mount GCP credentials (same as Spark)
      - ./spark-streaming/credentials:/credentials:ro
      
      # Mount output directories
      - ./dbt/target:/usr/app/target
      - ./dbt/logs:/usr/app/logs
    
    environment:
      - DBT_PROFILES_DIR=/usr/app
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/gcp-service-account-key.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}

volumes:
  kafka-data:
  spark-checkpoints:
  spark-logs:
