# dbt Profile Configuration
# Connects dbt to Google BigQuery

music_streaming:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: sublime-blade-484910-a4
      dataset: music_streaming_analytics  # dbt models will be created here
      threads: 4
      timeout_seconds: 300
      location: europe-west3  # Match source dataset location
      priority: interactive
      keyfile: /credentials/gcp-service-account-key.json
      
      # Optional: Use these for better performance
      maximum_bytes_billed: 2000000000  # 2 GB limit (increased for large datasets)
      
    prod:
      type: bigquery
      method: service-account
      project: sublime-blade-484910-a4
      dataset: music_streaming_analytics_prod
      threads: 8
      timeout_seconds: 300
      location: europe-west3
      priority: interactive
      keyfile: /credentials/gcp-service-account-key.json
      maximum_bytes_billed: 10000000000  # 10 GB limit

# Profile Configuration Notes:
# 
# 1. The 'dev' target uses dataset: music_streaming_analytics
#    This is where your dbt models will be created
# 
# 2. Source data comes from: music_streaming_data.raw_events
#    This is where Spark writes streaming data
# 
# 3. To use this profile locally:
#    - Ensure the keyfile path is correct (relative to dbt project root)
#    - Run: dbt debug (to test connection)
#    - Run: dbt run (to build models)
# 
# 4. Environment variables (optional):
#    You can use env vars instead of hardcoded values:
#    keyfile: "{{ env_var('DBT_BIGQUERY_KEYFILE') }}"
#    project: "{{ env_var('GCP_PROJECT_ID') }}"
