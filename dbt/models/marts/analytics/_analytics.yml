version: 2

models:
  - name: agg_daily_metrics
    description: >
      Daily platform-wide metrics and KPIs for executive dashboards.
      Aggregates all activity to daily level with key performance indicators.
    
    meta:
      owner: "data-engineering"
      refresh_frequency: "continuous"
      dashboard: "Executive Dashboard"
    
    columns:
      - name: metric_date
        description: "Date of metrics (Primary Key)"
        tests:
          - unique
          - not_null
      
      - name: total_songs_played
        description: "Total songs played on this date"
        tests:
          - not_null
      
      - name: active_users
        description: "Unique active users"
        tests:
          - not_null
      
      - name: total_sessions
        description: "Total user sessions"
        tests:
          - not_null
      
      - name: avg_session_duration_minutes
        description: "Average session duration"
      
      - name: skip_rate_pct
        description: "Percentage of songs skipped"
      
      - name: completion_rate_pct
        description: "Percentage of songs completed"
      
      - name: music_session_rate_pct
        description: "Percentage of sessions with music"
      
      - name: paid_conversion_rate_pct
        description: "Percentage of users on paid plan"
      
      - name: is_weekend
        description: "Boolean - is this a weekend?"
        tests:
          - not_null

  - name: agg_hourly_activity
    description: >
      Hourly platform activity metrics for identifying peak usage times.
      One row per date-hour combination with user and song play metrics.
    
    meta:
      owner: "data-engineering"
      refresh_frequency: "continuous"
      dashboard: "Operations Dashboard"
    
    columns:
      - name: activity_date
        description: "Date of activity (Partition Key)"
        tests:
          - not_null
      
      - name: activity_hour
        description: "Hour of day (0-23)"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 23
      
      - name: active_users
        description: "Active users in this hour"
        tests:
          - not_null
      
      - name: songs_played
        description: "Songs played in this hour"
        tests:
          - not_null
      
      - name: sessions_started
        description: "Sessions started in this hour"
        tests:
          - not_null
      
      - name: time_of_day
        description: "Time of day classification"
        tests:
          - accepted_values:
              values: ['morning', 'afternoon', 'evening', 'night']
      
      - name: songs_per_active_user
        description: "Average songs per active user"
      
      - name: skip_rate_pct
        description: "Skip rate for this hour"

  - name: agg_user_summary
    description: >
      Per-user lifetime metrics, favorite songs/artists, and behavior patterns.
      Used for personalization, segmentation, and retention analysis.
    
    meta:
      owner: "data-engineering"
      refresh_frequency: "daily"
      dashboard: "User Analytics"
    
    columns:
      - name: user_id
        description: "Unique user identifier (Primary Key)"
        tests:
          - unique
          - not_null
      
      - name: full_name
        description: "User full name"
      
      - name: subscription_level
        description: "Current subscription level"
        tests:
          - accepted_values:
              values: ['free', 'paid']
      
      - name: user_segment
        description: "User classification"
        tests:
          - accepted_values:
              values: ['new_user', 'casual_user', 'regular_user', 'power_user']
      
      - name: total_songs_played
        description: "Lifetime total songs played"
        tests:
          - not_null
      
      - name: unique_songs_played
        description: "Number of unique songs"
        tests:
          - not_null
      
      - name: unique_artists_listened
        description: "Number of unique artists"
        tests:
          - not_null
      
      - name: total_listening_hours
        description: "Total listening time in hours"
      
      - name: total_sessions
        description: "Total lifetime sessions"
        tests:
          - not_null
      
      - name: avg_session_duration_minutes
        description: "Average session duration"
      
      - name: skip_rate_pct
        description: "User's skip rate percentage"
      
      - name: completion_rate_pct
        description: "User's completion rate percentage"
      
      - name: preferred_device
        description: "User's preferred device"
        tests:
          - accepted_values:
              values: ['mobile', 'desktop', 'tablet']
      
      - name: preferred_time_of_day
        description: "When user listens most"
        tests:
          - accepted_values:
              values: ['morning', 'afternoon', 'evening', 'night']
      
      - name: listening_pattern
        description: "Weekend vs weekday preference"
        tests:
          - accepted_values:
              values: ['weekend_listener', 'weekday_listener']
      
      - name: favorite_artist_1
        description: "User's most played artist"
      
      - name: favorite_song_1
        description: "User's most played song"
      
      - name: ltv_score
        description: "Calculated lifetime value score"
      
      - name: is_inactive
        description: "Boolean - inactive for 30+ days?"
        tests:
          - not_null
