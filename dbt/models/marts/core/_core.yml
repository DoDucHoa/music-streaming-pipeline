version: 2

models:
  - name: fct_song_plays
    description: >
      Core fact table containing one row per song play event.
      Includes all dimensions and metrics for song play analytics.
      Partitioned by event_date and clustered by user_id, artist, song for optimal query performance.
    
    meta:
      owner: "data-engineering"
      refresh_frequency: "continuous"
      
    columns:
      - name: event_id
        description: "Unique identifier for each song play event (Primary Key)"
        tests:
          - unique
          - not_null
      
      - name: session_id
        description: "Foreign key to fct_sessions"
        tests:
          - not_null
          - relationships:
              to: ref('fct_sessions')
              field: session_id
              config:
                severity: warn  # Warn instead of fail for streaming data
      
      - name: user_id
        description: "Foreign key to dim_users"
        tests:
          - relationships:
              to: ref('dim_users')
              field: user_id
              config:
                where: "user_id IS NOT NULL"  # Allow nulls for guests
                severity: warn
      
      - name: artist_name
        description: "Artist name"
        tests:
          - not_null
      
      - name: song_title
        description: "Song title"
        tests:
          - not_null
      
      - name: song_identifier
        description: "Unique song identifier (artist + song)"
        tests:
          - not_null
      
      - name: song_duration_seconds
        description: "Song duration in seconds"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: subscription_level
        description: "User subscription tier at time of play"
        tests:
          - accepted_values:
              values: ['free', 'paid']
      
      - name: event_date
        description: "Date of event (partition key)"
        tests:
          - not_null
      
      - name: event_timestamp
        description: "Timestamp of event"
        tests:
          - not_null
      
      - name: device_type
        description: "Device used for playback"
        tests:
          - accepted_values:
              values: ['mobile', 'tablet', 'desktop', 'other']
      
      - name: likely_skip
        description: "Boolean - was this song likely skipped?"
        tests:
          - not_null
      
      - name: likely_complete_listen
        description: "Boolean - was this song completely listened to?"
      
      - name: is_weekend
        description: "Boolean - did event occur on weekend?"
        tests:
          - not_null
      
      - name: time_of_day
        description: "Time of day classification"
        tests:
          - accepted_values:
              values: ['morning', 'afternoon', 'evening', 'night']

  - name: fct_sessions
    description: >
      Core fact table containing one row per user session.
      Includes aggregated session metrics and engagement scores.
      Partitioned by session_date and clustered by user_id for optimal query performance.
    
    meta:
      owner: "data-engineering"
      refresh_frequency: "continuous"
    
    columns:
      - name: session_id
        description: "Unique session identifier (Primary Key)"
        tests:
          - unique
          - not_null
      
      - name: user_id
        description: "Foreign key to dim_users"
        tests:
          - relationships:
              to: ref('dim_users')
              field: user_id
              config:
                where: "user_id IS NOT NULL"
                severity: warn
      
      - name: session_start_timestamp
        description: "When session started"
        tests:
          - not_null
      
      - name: session_end_timestamp
        description: "When session ended"
        tests:
          - not_null
      
      - name: session_date
        description: "Date of session start (partition key)"
        tests:
          - not_null
      
      - name: session_duration_seconds
        description: "Total session duration in seconds"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      
      - name: total_events
        description: "Total events in session"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      
      - name: songs_played
        description: "Number of songs played in session"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      
      - name: unique_pages_visited
        description: "Number of unique pages visited"
      
      - name: engagement_score
        description: "Calculated engagement score"
        tests:
          - not_null
      
      - name: has_song_plays
        description: "Boolean - did session include song plays?"
        tests:
          - not_null
      
      - name: is_long_session
        description: "Boolean - session > 5 minutes?"
        tests:
          - not_null
      
      - name: session_length_category
        description: "Categorized session duration"
        tests:
          - accepted_values:
              values: ['very_short', 'short', 'medium', 'long', 'very_long']
      
      - name: listening_intensity
        description: "Classification of listening behavior"
        tests:
          - accepted_values:
              values: ['browsing', 'light_listening', 'moderate_listening', 'heavy_listening']
      
      - name: engagement_tier
        description: "Engagement level tier"
        tests:
          - accepted_values:
              values: ['low', 'medium', 'high', 'very_high']
      
      - name: avg_seconds_per_song
        description: "Average time spent per song in session"
      
      - name: device_type
        description: "Device used for session"
        tests:
          - accepted_values:
              values: ['mobile', 'tablet', 'desktop', 'other']
