version: 2

models:
  - name: dim_users
    description: >
      User dimension table containing one row per user with latest attributes
      and lifetime metrics. Implements SCD Type 1 (overwrite with latest values).
    
    meta:
      owner: "data-engineering"
      refresh_frequency: "daily"
    
    columns:
      - name: user_id
        description: "Unique user identifier (Primary Key). Empty string for guest users."
        tests:
          - unique
          - not_null
      
      - name: first_name
        description: "User first name (NULL for guest users)"
        # No not_null test - guest users have NULL names
      
      - name: last_name
        description: "User last name (NULL for guest users)"
        # No not_null test - guest users have NULL names
      
      - name: full_name
        description: "Concatenated first + last name (NULL for guest users)"
        # No not_null test - guest users have NULL names
      
      - name: gender
        description: "User gender"
        tests:
          - accepted_values:
              values: ['M', 'F']
      
      - name: subscription_level
        description: "Current subscription level"
        tests:
          - accepted_values:
              values: ['free', 'paid']
      
      - name: city
        description: "User city (latest)"
      
      - name: state
        description: "User state (latest)"
      
      - name: location_display
        description: "Formatted location string"
      
      - name: registration_timestamp
        description: "When user registered"
      
      - name: registration_date
        description: "Registration date"
      
      - name: last_activity_timestamp
        description: "Most recent activity timestamp"
        tests:
          - not_null
      
      - name: last_activity_date
        description: "Most recent activity date"
        tests:
          - not_null
      
      - name: first_seen_date
        description: "First date user appeared in data"
        tests:
          - not_null
      
      - name: last_seen_date
        description: "Last date user appeared in data"
        tests:
          - not_null
      
      - name: days_active
        description: "Number of distinct days user was active"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      
      - name: total_events
        description: "Total number of events generated by user"
        tests:
          - not_null
      
      - name: total_songs_played
        description: "Total songs played by user"
        tests:
          - not_null
      
      - name: lifetime_days
        description: "Days between first and last activity"
      
      - name: user_segment
        description: "User classification based on activity"
        tests:
          - accepted_values:
              values: ['new_user', 'casual_user', 'regular_user', 'power_user']
      
      - name: is_inactive
        description: "Boolean - user inactive for 30+ days?"
        tests:
          - not_null
      
      - name: is_paid_subscriber
        description: "Boolean - currently on paid plan?"
        tests:
          - not_null

  - name: dim_songs
    description: >
      Song dimension table containing one row per unique song (artist + title).
      Includes aggregated popularity metrics and play statistics.
    
    meta:
      owner: "data-engineering"
      refresh_frequency: "daily"
    
    columns:
      - name: song_key
        description: "Surrogate key for song (Primary Key)"
        tests:
          - unique
          - not_null
      
      - name: song_identifier
        description: "Natural key (artist + song)"
        tests:
          - unique
          - not_null
      
      - name: artist_name
        description: "Artist name"
        tests:
          - not_null
      
      - name: song_title
        description: "Song title"
        tests:
          - not_null
      
      - name: song_duration_seconds
        description: "Song duration in seconds"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: song_duration_minutes
        description: "Song duration in minutes"
      
      - name: song_length_category
        description: "Categorized song length"
        tests:
          - accepted_values:
              values: ['very_short', 'short', 'medium', 'long', 'very_long']
      
      - name: total_plays
        description: "Total number of plays"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      
      - name: unique_listeners
        description: "Number of unique users who played this song"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      
      - name: days_played
        description: "Number of distinct days song was played"
        tests:
          - not_null
      
      - name: avg_plays_per_listener
        description: "Average plays per unique listener"
      
      - name: first_played_date
        description: "First date song was played"
        tests:
          - not_null
      
      - name: last_played_date
        description: "Most recent play date"
        tests:
          - not_null
      
      - name: days_in_catalog
        description: "Days between first and last play"
      
      - name: popularity_tier
        description: "Song popularity classification"
        tests:
          - accepted_values:
              values: ['rare', 'niche', 'moderate', 'popular', 'very_popular']
      
      - name: played_in_last_week
        description: "Boolean - played in last 7 days?"
        tests:
          - not_null
      
      - name: played_in_last_month
        description: "Boolean - played in last 30 days?"
        tests:
          - not_null
