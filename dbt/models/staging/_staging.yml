version: 2

sources:
  - name: music_streaming
    description: "Raw streaming events from Spark pipeline"
    database: sublime-blade-484910-a4
    schema: music_streaming_data
    
    tables:
      - name: raw_events
        description: "Raw events table populated by Spark Streaming from Kafka"
        
        # Freshness check - warn if data is older than expected
        freshness:
          warn_after: {count: 1, period: hour}
          error_after: {count: 3, period: hour}
        
        # Loaded at timestamp (when data arrives)
        loaded_at_field: processed_at
        
        columns:
          - name: event_id
            description: "Unique identifier for each event (UUID)"
            tests:
              - unique
              - not_null
          
          - name: session_id
            description: "Session identifier from eventsim"
          
          - name: userId
            description: "User identifier (null for guest users)"
          
          - name: ts
            description: "Event timestamp (when event occurred)"
            tests:
              - not_null
          
          - name: page
            description: "Page/event type (NextSong, Home, Login, etc.)"
            tests:
              - not_null
              - accepted_values:
                  values: ['NextSong', 'Home', 'Login', 'Logout', 'About', 'Help', 
                          'Settings', 'Save Settings', 'Upgrade', 'Submit Upgrade', 'Downgrade', 
                          'Submit Downgrade', 'Cancellation Confirmation', 'Error', 'Thumbs Up', 'Thumbs Down',
                          'Add to Playlist', 'Add Friend', 'Roll Advert']

models:
  - name: stg_events
    description: "Cleaned and standardized events from raw_events table. This is the foundation for all downstream analytics."
    
    columns:
      - name: event_id
        description: "Unique event identifier"
        tests:
          - unique
          - not_null
      
      - name: session_id
        description: "Session identifier"
      
      - name: user_id
        description: "User identifier (null for guests)"
      
      - name: first_name
        description: "User first name"
      
      - name: last_name
        description: "User last name"
      
      - name: gender
        description: "User gender (M/F)"
        tests:
          - accepted_values:
              values: ['M', 'F']
              config:
                severity: warn  # Warn instead of fail for data quality
      
      - name: subscription_level
        description: "Subscription tier (free/paid)"
        tests:
          - accepted_values:
              values: ['free', 'paid']
      
      - name: auth_status
        description: "Authentication status"
        tests:
          - accepted_values:
              values: ['Guest', 'Logged In', 'Logged Out', 'Cancelled']
      
      - name: page_name
        description: "Page/event type"
        tests:
          - not_null
      
      - name: event_timestamp
        description: "When the event occurred"
        tests:
          - not_null
      
      - name: event_date
        description: "Event date (for partitioning and aggregations)"
        tests:
          - not_null
      
      - name: event_hour
        description: "Hour of day (0-23)"
      
      - name: day_of_week
        description: "Day of week (1=Sunday, 7=Saturday)"

  - name: stg_song_plays
    description: "Song play events only (NextSong page) with enriched metadata for music analytics."
    
    columns:
      - name: event_id
        description: "Unique event identifier"
        tests:
          - unique
          - not_null
      
      - name: artist_name
        description: "Artist name"
        tests:
          - not_null
      
      - name: song_title
        description: "Song title"
        tests:
          - not_null
      
      - name: song_duration_seconds
        description: "Song duration in seconds"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 7200  # 2 hours max
      
      - name: song_duration_minutes
        description: "Song duration in minutes (derived)"
      
      - name: song_length_category
        description: "Categorized song length"
        tests:
          - accepted_values:
              values: ['very_short', 'short', 'medium', 'long', 'very_long']
      
      - name: device_type
        description: "Device classification from user agent"
        tests:
          - accepted_values:
              values: ['mobile', 'tablet', 'desktop', 'other']
      
      - name: browser
        description: "Browser type from user agent"
      
      - name: time_of_day
        description: "Time of day classification"
        tests:
          - accepted_values:
              values: ['morning', 'afternoon', 'evening', 'night']
      
      - name: is_weekend
        description: "Boolean flag for weekend events"
        tests:
          - not_null
      
      - name: event_date
        description: "Event date"
        tests:
          - not_null
