version: 2

models:
  - name: int_user_sessions
    description: >
      Sessionized user activity with session-level aggregations and metrics.
      Sessions are defined by session_id from eventsim.
      This model is ephemeral (not materialized) and used as input for fact tables.
    
    columns:
      - name: session_id
        description: "Unique session identifier"
        tests:
          - unique
          - not_null
      
      - name: user_id
        description: "User who owns this session"
      
      - name: session_start_timestamp
        description: "When the session started"
        tests:
          - not_null
      
      - name: session_end_timestamp
        description: "When the session ended"
        tests:
          - not_null
      
      - name: session_date
        description: "Date of session start (for partitioning)"
        tests:
          - not_null
      
      - name: session_duration_seconds
        description: "Total session duration in seconds"
        tests:
          - not_null
      
      - name: session_duration_minutes
        description: "Total session duration in minutes"
      
      - name: total_events
        description: "Total number of events in session"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      
      - name: songs_played
        description: "Number of songs played in session"
        tests:
          - not_null
      
      - name: unique_pages_visited
        description: "Number of unique pages visited in session"
      
      - name: has_song_plays
        description: "Boolean flag - did user play any songs?"
      
      - name: is_long_session
        description: "Boolean flag - session longer than 5 minutes?"
      
      - name: engagement_score
        description: "Calculated engagement score based on activity"
      
      - name: session_length_category
        description: "Categorized session length"
        tests:
          - accepted_values:
              values: ['very_short', 'short', 'medium', 'long', 'very_long']
      
      - name: device_type
        description: "Device type for this session"
        tests:
          - accepted_values:
              values: ['mobile', 'tablet', 'desktop', 'other']

  - name: int_song_enriched
    description: >
      Enriched song play events with additional context such as play sequence,
      skip detection, and listening patterns. This is ephemeral and feeds into
      the fct_song_plays fact table.
    
    columns:
      - name: event_id
        description: "Unique event identifier"
        tests:
          - unique
          - not_null
      
      - name: play_sequence_in_session
        description: "Position of this song in the session (1st, 2nd, etc.)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      
      - name: seconds_since_previous_song
        description: "Seconds elapsed since previous song in session"
      
      - name: is_first_song_in_session
        description: "Boolean flag - is this the first song?"
        tests:
          - not_null
      
      - name: is_last_song_in_session
        description: "Boolean flag - is this the last song?"
        tests:
          - not_null
      
      - name: likely_skip
        description: "Boolean flag - was previous song likely skipped?"
        tests:
          - not_null
      
      - name: likely_complete_listen
        description: "Boolean flag - was previous song listened completely?"
      
      - name: song_identifier
        description: "Concatenated artist + song for grouping"
        tests:
          - not_null
      
      - name: listening_time_of_day
        description: "Time of day when song was played"
        tests:
          - accepted_values:
              values: ['morning', 'afternoon', 'evening', 'night']
      
      - name: previous_song_title
        description: "Title of previous song in session"
      
      - name: previous_artist_name
        description: "Artist of previous song in session"
