version: '3.8'

services:
  dbt:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dbt-music-streaming
    volumes:
      # Mount dbt project (for development)
      - ./models:/usr/app/models
      - ./macros:/usr/app/macros
      - ./tests:/usr/app/tests
      - ./profiles.yml:/usr/app/profiles.yml:ro
      - ./dbt_project.yml:/usr/app/dbt_project.yml:ro
      
      # Mount GCP credentials
      # Use relative path from project root (../spark-streaming/credentials)
      # This is portable - works on any machine as long as project structure is maintained
      - ${CREDENTIALS_PATH:-../spark-streaming/credentials}:/credentials:ro
      
      # Mount target directory (compiled SQL, logs)
      - ./target:/usr/app/target
      - ./logs:/usr/app/logs
    
    environment:
      - DBT_PROFILES_DIR=/usr/app
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/gcp-service-account-key.json
    
    # No default command - run interactively
    # Usage: docker-compose run --rm dbt run
    #        docker-compose run --rm dbt test
    #        docker-compose run --rm dbt docs generate
