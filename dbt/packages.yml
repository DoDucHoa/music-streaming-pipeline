# dbt Packages
# External packages to extend dbt functionality

packages:
  # dbt utilities - useful macros for common tasks
  - package: dbt-labs/dbt_utils
    version: 1.1.1
  
  # Audit helper - for comparing datasets during refactoring
  - package: dbt-labs/audit_helper
    version: 0.9.0
  
  # Codegen - generate dbt code from database schemas
  - package: dbt-labs/codegen
    version: 0.12.1

# To install packages, run:
#   dbt deps
